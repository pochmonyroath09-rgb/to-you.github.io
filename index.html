<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Message for You 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #713b50;
      background: linear-gradient(135deg, #fff0f5, #f8d9e8, #fce7f3);
    }

    .card {
      width: 100%;
      max-width: 430px;
      margin: 35px auto;
      padding: 30px 22px;
      border: 1px solid #ffffff;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 35px #a64d791c;
    }

    .heart {
      font-size: 48px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      color: #d64f83;
      font-size: 28px;
    }

    .subtitle {
      line-height: 1.7;
      color: #896b7a;
    }

    .name-button {
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #f8d3e3;
      color: #8d3158;
      font-size: 16px;
      cursor: pointer;
      transition: 0.25s;
    }

    .name-button:hover {
      background: #e978a6;
      color: white;
      transform: translateY(-2px);
    }

    #message {
      display: none;
      margin-top: 22px;
      padding: 20px 14px;
      border-radius: 16px;
      background: #fff0f6;
      line-height: 1.8;
      animation: appear 0.5s ease;
    }

    #message h2 {
      color: #d64f83;
      font-size: 20px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #a58a98;
    }

    @keyframes heartbeat {
      50% { transform: scale(1.15); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">💌</div>

    <h1>A Little Message for You</h1>

    <p class="subtitle">
      A LETTER FOR YOU FROM MONYROATH.<br>
      Choose your name and read your message. 💗
    </p>

    <button class="name-button"
      onclick="showMessage('Urt Tanghouy')">
      🌷 Urt Tanghouy 🌷
    </button>

    <section id="message" aria-live="polite"></section>

    <p class="footer">
      Made with love, just for you ♡
    </p>
  </main>

  
<script>
  const messages = {
    "Urt Tanghouy": {
      title: "Dear Tanghouy 🌷",
      text: `In your upcoming competition, I hope you get the best rank you want!

Actually, you are competing against three people, and I hope you can achieve 1st place.

Do your best, and everyone will congratulate you on your result, including me.

I believe you can do it. Susu, Houy!! ❤️🌷`
    }
  };

  function showMessage(name) {
    const messageBox = document.getElementById("message");
    const message = messages[name];

    if (!message) return;

    messageBox.innerHTML = "";

    const heading = document.createElement("h2");
    heading.textContent = message.title;

    const paragraph = document.createElement("p");
    paragraph.textContent = message.text;

    messageBox.append(heading, paragraph);
    messageBox.style.display = "block";

    messageBox.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }
</script>
